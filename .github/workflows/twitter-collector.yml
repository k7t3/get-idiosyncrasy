name: twitter-collector

on:
  # schedule:
  #   - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: idiosyncrasy

    steps:
      - name: Checkout work repository
        uses: actions/checkout@v6
        with:
          repository: k7t3/widios
          path: ./widios
          ref: x
          ssh-key: ${{ secrets.REPO_KEY }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore scweet state cache
        uses: actions/cache/restore@v4
        id: scweet-cache
        with:
          path: ./widios/twitter-collector/scweet_state.db
          key: scweet-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            scweet-state-${{ runner.os }}-

      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
        working-directory: ./widios/twitter-collector

      - name: Run twitter-collector
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_AUTH_TOKEN_2: ${{ secrets.TWITTER_AUTH_TOKEN_2 }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: python -m twitter_collector
        working-directory: ./widios/twitter-collector

      - name: Save scweet state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ./widios/twitter-collector/scweet_state.db
          key: ${{ steps.scweet-cache.outputs.cache-primary-key }}
