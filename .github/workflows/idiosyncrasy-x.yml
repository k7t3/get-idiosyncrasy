name: idiosyncrasy-type-x

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  main:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false
    environment:
      name: idiosyncrasy
      
    steps:
      - name: Checkout work repository
        uses: actions/checkout@v6
        with:
          repository: k7t3/widios
          path: ./widios
          ssh-key: ${{ secrets.REPO_KEY }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Get widios commit hash
        id: widios-commit
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
        working-directory: ./widios

      - name: Restore backend-cli cache
        uses: actions/cache/restore@v5
        id: backend-cli-cache
        with:
          path: ./widios/backend-cli/.cache
          key: backend-cli-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            backend-cli-cache-${{ runner.os }}-

      - name: Restore backend-cli build cache
        uses: actions/cache/restore@v5
        id: backend-cli-build-cache
        with:
          path: ./widios/backend-cli/build
          key: backend-cli-build-cache-${{ runner.os }}-${{ steps.widios-commit.outputs.sha }}

      - name: Verify Gradle
        run: ./gradlew --version
        working-directory: ./widios/backend-cli
      
      - name: run idiosyncrasy
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          GH_MODEL_TOKEN: ${{ secrets.GH_MODEL_TOKEN }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          DISABLE_TOPICS_DETECTION: ${{ vars.DISABLE_TOPICS_DETECTION }}
        run: ./gradlew run --no-daemon
        working-directory: ./widios/backend-cli

      - name: Save backend-cli cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ./widios/backend-cli/.cache
          key: ${{ steps.backend-cli-cache.outputs.cache-primary-key }}

      - name: Save backend-cli build cache
        uses: actions/cache/save@v5
        with:
          path: ./widios/backend-cli/build
          key: ${{ steps.backend-cli-build-cache.outputs.cache-primary-key }}
